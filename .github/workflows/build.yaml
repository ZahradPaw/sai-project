name: Build and Package JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install JADE to local Maven repo
      run: mvn install:install-file -Dfile=lib/jade.jar -DgroupId=com.tilab.jade -DartifactId=jade -Dversion=4.6.0 -Dpackaging=jar

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Upload JAR as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-planner-jar
        path: target/*.jar
